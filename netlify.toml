# ---------------------------------------------------------------------------
# The Reading Bridge — Netlify configuration
#
# The site is GENERATED. The editable content lives in content/site.json and
# content/policies.json; build/generate.py renders those, plus the templates in
# build/templates/, into the 13 HTML pages — in place, in this folder.
#
# Netlify runs the generator at build time and then publishes this folder
# as-is (publish = "."), so the deployed file structure is unchanged.
#
#   build/generate.py            the generator (standard library only)
#   build/templates/             the page templates
#   python3 build/generate.py --check
#                                renders to a temp dir and diffs against the
#                                live files; must report byte-identical
#
# The generator is idempotent: when the content has not changed it rewrites the
# 13 pages with exactly the same bytes, so a content-only commit stays a
# content-only diff.
# ---------------------------------------------------------------------------

[build]
# Render the pages from the content files. Standard-library Python 3, which is
# present on Netlify's build image; nothing is installed.
command = "python3 build/generate.py"

# Publish the repository root (this folder, which holds index.html, main.js,
# styles.css, content/, assets/ ...).
publish = "."

# --- Caching ---------------------------------------------------------------
# Long cache for unchanging binary assets (logos). The file name never
# changes, so it is safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Owner edits go live immediately for these, so never cache them.
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/content/site.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# --- 404 handling ----------------------------------------------------------
# This is a genuine multi-page site — every route (services.html, contact.html
# etc.) is its own real file. A blanket "send everything to index.html"
# redirect would therefore serve the WRONG page for real routes, so it is
# deliberately NOT added. Unknown paths fall through to Netlify's own 404 page.
# (If a branded 404 page is wanted, that is a separate .html file.)
