name: Deploy to Netlify

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Generate and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the content repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate the 13 static pages from CMS content
        run: python3 build/generate.py

      - name: Deploy the generated site to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >-
          npx --yes netlify-cli@latest deploy
          --prod
          --dir .
          --site "$NETLIFY_SITE_ID"
          --auth "$NETLIFY_AUTH_TOKEN"
          --message "GitHub Actions deploy $GITHUB_SHA"
