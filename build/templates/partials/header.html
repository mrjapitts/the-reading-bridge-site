<header class="site">
  <div class="nav-row wrap">
    <a class="brand" href="{{ page.prefix }}index.html" aria-label="{{ site.chrome.brand_aria }}">
      <img src="{{ page.prefix }}assets/logo-lockup.png" alt="{{ site.chrome.logo_alt }}" width="52" height="52">
      {% if page.depth == 'root' %}<span class="brand-text">{% else %}<div class="brand-text">{% endif %}
        <span class="brand-name">{{ site.business.name }}</span>
        <span class="brand-desc">{{ site.business.descriptor }}</span>
      {% if page.depth == 'root' %}</span>{% else %}</div>{% endif %}
    </a>
    <button class="nav-toggle" aria-label="{{ site.chrome.nav_toggle_label }}" aria-expanded="false">{{ site.chrome.nav_toggle_text }}</button>
    <nav class="nav-links" id="nav-links" aria-label="{{ site.chrome.nav_aria_label }}">
      {% for item in site.nav %}<a href="{{ page.prefix }}{{ item.href }}"{% if item.href == page.id %} class="active"{% endif %}>{{ item.label }}</a>{% endfor %}
      <a class="btn btn-primary" href="{{ page.prefix }}book.html">{{ site.cta.book_free_session }}</a>
    </nav>
  </div>
</header>
