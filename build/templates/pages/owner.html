<main id="main">

<section>

    <div class="grid grid-2">
      <figure><img class="emblem-img emblem-img-owner" src="assets/logo-emblem.png" alt="{{ site.chrome.emblem_alt }}"></figure>
      <div>
        <p>{{ site.owner.bio_intro }}</p>
        <p>{{ site.owner.bio_extra }}</p>
        <p class="micro">{{ site.owner.signature }}</p>
        <p class="mt-1"><a class="btn btn-navy" href="book.html">{{ site.cta.book_free_session }}</a></p>
      </div>
    </div>
  </div>
</section>
</main>
